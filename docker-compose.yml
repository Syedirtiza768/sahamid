services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahamid-web
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/apache/sahamid.conf:/etc/apache2/sites-available/000-default.conf:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
    networks:
      - sahamid-net
    restart: unless-stopped

  db:
    image: mariadb:10.3
    container_name: sahamid-db
    # Legacy ERP data contains zero dates and other values rejected by
    # STRICT_TRANS_TABLES. Keep the development MariaDB compatible with the
    # existing application and imports by disabling SQL strict mode globally.
    command: ["--sql-mode="]
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sahamid
      MYSQL_USER: irtiza
      MYSQL_PASSWORD: netetech321
    volumes:
      - sahamid-dbdata:/var/lib/mysql
      - ./docker/init-db/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backup/sahamid_structure.sql:/docker-entrypoint-initdb.d/02-sahamid-structure.sql:ro
      - ./backup/sahamid_data.sql:/docker-entrypoint-initdb.d/03-sahamid-data.sql:ro
      - "./localhost(4).sql:/docker-entrypoint-initdb.d/04-sah_saherp.sql:ro"
      - ./docker/init-db/05-dms-tables.sql:/docker-entrypoint-initdb.d/05-dms-tables.sql:ro
      - ./docker/init-db/06-ib_form_sheet.sql:/docker-entrypoint-initdb.d/06-ib_form_sheet.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sahamid-net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sahamid-pma
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - sahamid-net
    restart: unless-stopped

volumes:
  sahamid-dbdata:

networks:
  sahamid-net:
    driver: bridge
