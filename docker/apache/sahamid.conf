<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Apache does not pass container env to PHP by default; mod_php would see no DB_HOST and fall back to localhost.
    SetEnv DB_HOST db

    # The app was originally served under /sahamid/ in XAMPP (htdocs/sahamid/).
    # All internal redirects use hardcoded /sahamid/ paths.
    # This alias maps /sahamid back to the document root so those redirects work.
    Alias /sahamid /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Mirror XAMPP default: enable output buffering so session_start()
        # works even when HTML is output before <?php in index.php
        php_value output_buffering 4096
        # E_ALL & ~E_NOTICE(8) & ~E_DEPRECATED(8192) & ~E_STRICT(2048) = 22519
        php_value error_reporting 22519
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
