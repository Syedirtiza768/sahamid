services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.windows
    container_name: sahamid-windows
    ports:
      - "8090:80"
      - "3308:3306"
    volumes:
      # Persist MariaDB data across container restarts
      - type: volume
        source: sahamid-windb
        target: 'C:\xampp\mysql\data'
      # Mount SQL files read-only (not copied into image - too large)
      - type: bind
        source: ./backup/sahamid_structure.sql
        target: 'C:\docker\sahamid_structure.sql'
        read_only: true
      - type: bind
        source: ./backup/sahamid_data.sql
        target: 'C:\docker\sahamid_data.sql'
        read_only: true
    restart: unless-stopped
    isolation: process

volumes:
  sahamid-windb:
